    }

    async function tokenGueltig() {
      const k = geraet.konto;
      if (k.idToken && Date.now() < k.ablauf - 60000) return k.idToken;
      return tokenErneuern();
    }

    function sitzungEnde() {
      geraet.konto.refreshToken = "";
      geraet.konto.idToken = "";
      geraet.konto.ablauf = 0;
      syncAnhalten();
      geraetSpeichern();
      anzeigen();
    }

    // Abmelden: Die Daten bleiben in der Cloud, werden aber von diesem Gerät entfernt.
    function abmelden() {
      geraet.konto.refreshToken = "";
      geraet.konto.idToken = "";
      geraet.konto.ablauf = 0;
      geraet.konto.uid = "";
      syncAnhalten();
      try {
        localStorage.removeItem(SPEICHER_KEY);
        localStorage.removeItem(KALENDER_CACHE_KEY);
      } catch (fehler) { /* nichts zu löschen */ }
      geraetSpeichern();
      try { location.reload(); } catch (fehler) { /* wird unten neu gezeichnet */ }
      anzeigen();
    }

    function regelnText(uidA, uidB) {
      const bedingung = "auth != null && (auth.uid === '" + (uidA || "DENISES_ID") + "' || auth.uid === '" + (uidB || "BENIS_ID") + "')";
      return JSON.stringify({ rules: { ".read": bedingung, ".write": bedingung } }, null, 2);
    }

    function einladungsCode() {
      const k = geraet.konto;
      return "HAUS1." + btoa(unescape(encodeURIComponent(JSON.stringify({ u: k.dbUrl, k: k.apiKey, e: k.emails }))));
    }

    function einladungLesen(text) {
      try {
        const t = text.trim();
        if (t.indexOf("HAUS1.") !== 0) return null;
        const daten = JSON.parse(decodeURIComponent(escape(atob(t.slice(6)))));
        if (daten.u && daten.k && Array.isArray(daten.e)) return daten;
      } catch (fehler) { /* ungültig */ }
      return null;
    }

    function kopieren(text, meldung) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => toast(meldung), () => prompt("Zum Kopieren:", text));
      } else {
        prompt("Zum Kopieren:", text);
      }
    }

    // ----- Abgleich zwischen Denise und Beni -----
    function syncAktiv() {
      return !geraet.lokal && kontoEingerichtet() && angemeldet();
    }

    function syncUrl(token) {
      return geraet.konto.dbUrl.replace(/\/+$/, "") + "/haushalt.json?auth=" + encodeURIComponent(token);
    }

    function syncStatusText() {
      if (!syncAktiv()) return "Nur auf diesem Gerät (nicht geschützt)";
      if (sync.status === "fehler") return "Verbindungsproblem: " + sync.fehler;
      if (!sync.zeit) return "Verbinde …";
      return "Privat und verbunden · zuletzt " + pad2(sync.zeit.getHours()) + ":" + pad2(sync.zeit.getMinutes());
    }

    function setzeSyncStatus(element) {
      element.textContent = syncStatusText();
      element.classList.toggle("ok", syncAktiv() && sync.status === "ok");
      element.classList.toggle("fehler", syncAktiv() && sync.status === "fehler");
    }

    function syncStatusZeigen() {
      document.querySelectorAll(".sync-status").forEach(setzeSyncStatus);
    }

    function syncPlanen() {
      if (!syncAktiv()) return;
      clearTimeout(sync.pushTimer);
      sync.pushTimer = setTimeout(syncPushen, 700);
    }

    async function datenbankAbruf(methode, body) {
      for (let versuch = 0; versuch < 2; versuch++) {
        const token = await tokenGueltig();
        let antwort;
        try {
          antwort = await fetch(syncUrl(token), {
            method: methode,
            headers: body ? { "Content-Type": "application/json" } : undefined,
            body: body,
            cache: "no-store",
          });
        } catch (fehler) {
          throw new Error("Keine Verbindung zum Internet.");
        }
        if (antwort.status === 401 && versuch === 0) {
          geraet.konto.ablauf = 0;   // vielleicht nur abgelaufen: einmal neu versuchen
          continue;
        }
        if (antwort.status === 401) {
          throw new Error("Kein Zugriff. Deine Benutzer-ID " + geraet.konto.uid + " ist in den Datenbank-Regeln noch nicht freigegeben.");
        }
        if (!antwort.ok) throw new Error("Der Server antwortet mit " + antwort.status + ".");
        return antwort;
      }
    }

    async function syncPushen() {
      if (!syncAktiv()) return;
      clearTimeout(sync.pushTimer);
      sync.pushTimer = null;
      if (!geaendertAm) geaendertAm = Date.now();
      try {
        await datenbankAbruf("PUT", JSON.stringify({ geaendert: geaendertAm, daten: inhaltString() }));
        sync.status = "ok";
        sync.zeit = new Date();
        sync.fehler = null;
      } catch (fehler) {
        if (fehler.sitzung) { sitzungEnde(); return; }
        sync.status = "fehler";
        sync.fehler = fehler.message || String(fehler);
      }
      syncStatusZeigen();
    }

    // Nur wenn gerade wirklich etwas getippt wird, wartet die Übernahme der Änderung
    function benutzerTippt() {
      const a = document.activeElement;
      return !!a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "checkbox" && a.type !== "file" && a.type !== "date" && a.value !== ""));
    }

    function fremdUebernehmen(remote) {
      let daten;
      try { daten = JSON.parse(remote.daten); } catch (fehler) { return; }
      if (!daten || !Array.isArray(daten.projekte)) return;

      projekte = daten.projekte;
      naechsteId = daten.naechsteId;
      if (Array.isArray(daten.personen)) personen = daten.personen;
      if (typeof daten.preis === "string") preis = daten.preis;
      if (Array.isArray(daten.kalender)) kalender = daten.kalender;
      if (typeof daten.kalenderProxy === "string") kalenderProxy = daten.kalenderProxy;
      if (Array.isArray(daten.notizen)) notizen = daten.notizen;
      normalisieren();
      geaendertAm = remote.geaendert;
      sync.letzterInhalt = inhaltString();   // zählt nicht als eigene Änderung
      if (!projekte.some((p) => p.id === aktivId)) aktivId = null;
      anzeigen();
      kalenderAktualisieren(false);
    }

    async function syncAbfragen() {
      if (!syncAktiv() || sync.laeuft) return;
      sync.laeuft = true;
      try {
        const antwort = await datenbankAbruf("GET");
        const remote = await antwort.json();

        if (remote && typeof remote.daten === "string") {
          if (remote.geaendert > geaendertAm) {
            // Die andere Person war schneller. Nicht übernehmen, solange hier getippt wird.
            if (!sync.pushTimer && !benutzerTippt()) fremdUebernehmen(remote);
          } else if (remote.geaendert < geaendertAm && !sync.pushTimer) {
            await syncPushen();
          }
        } else if (!sync.pushTimer) {
          await syncPushen();   // die Cloud ist noch leer: erste Daten hochladen
        }
        sync.status = "ok";
        sync.zeit = new Date();
        sync.fehler = null;
      } catch (fehler) {
        if (fehler.sitzung) { sync.laeuft = false; sitzungEnde(); return; }
        sync.status = "fehler";
        sync.fehler = fehler.message || String(fehler);
      }
      sync.laeuft = false;
      syncStatusZeigen();
    }

    function syncAnhalten() {
      clearInterval(sync.intervall);
      clearTimeout(sync.pushTimer);
      sync.intervall = null;
      sync.pushTimer = null;
    }

    function syncStarten() {
      syncAnhalten();
      if (!syncAktiv()) return;
      sync.intervall = setInterval(syncAbfragen, 4000);
      syncAbfragen();
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        syncAbfragen();
        kalenderAktualisieren(false);
      }
    });

    // ---------- Hilfsfunktionen ----------
    function el(tag, klasse, text) {
      const e = document.createElement(tag);
      if (klasse) e.className = klasse;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function farbeVon(p) {
      const nummer = Number.isInteger(p.farbe) ? p.farbe : projekte.indexOf(p);
      return FARBEN[Math.abs(nummer) % FARBEN.length];
    }

    function setFarbe(element, f) {
      element.style.setProperty("--weich", f.weich);
      element.style.setProperty("--text", f.text);
      element.style.setProperty("--haupt", f.haupt);
    }

    // Nächste freie Farbe für ein neues Projekt
    function naechsteFarbe() {
      const benutzt = projekte.map((p) => p.farbe);
      for (let i = 0; i < FARBEN.length; i++) {
        if (!benutzt.includes(i)) return i;
      }
      return projekte.length % FARBEN.length;
    }

    function aktivesProjekt() {
      return projekte.find((p) => p.id === aktivId);
    }

    function zaehlen(p) {
      return {
        gesamt: p.aufgaben.length,
        fertig: p.aufgaben.filter((a) => a.erledigt).length,
      };
    }

    function standText(p) {
      const { gesamt, fertig } = zaehlen(p);
      return gesamt === 0 ? "Noch keine Aufgaben" : fertig + " von " + gesamt + " erledigt";
    }

    function balkenBauen(p) {
      const { gesamt, fertig } = zaehlen(p);
      const balken = el("div", "balken");
      const fuellung = el("span");
      fuellung.style.width = (gesamt ? (fertig / gesamt) * 100 : 0) + "%";
      balken.appendChild(fuellung);
      return balken;
    }

    // ---------- Anzeige ----------
    const ansicht = document.getElementById("ansicht");
    let neuesProjektOffen = false;
    let neuesProjektRanked = false;   // «Ranked» beim Erstellen eines Projekts
    let neuesProjektTyp = "liste";     // "liste" (Checkliste) oder "notiz" (Notiz)
    let fokusZiel = null;     // "aufgabe" = Feld für neue Aufgabe fokussieren
    let fokusAuf = null;      // Aufgabe, deren Unteraufgaben-Feld fokussiert wird
    const offeneAufgaben = new WeakSet();
    const erledigtOffen = new Set();   // Projekte, bei denen «Erledigt» aufgeklappt ist

    // ----- Menüleiste unten -----
    const TAB_SYMBOLE = {
      start: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>',
      listen: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>',
      kalender: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
      einstellungen: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>',
    };

    const TABS = [
      { id: "start", name: "Start" },
      { id: "listen", name: "Projekte" },
      { id: "kalender", name: "Kalender" },
      { id: "einstellungen", name: "Einstellungen" },
    ];

    function aktiverTab() {
      if (seite === "einstellungen") return "einstellungen";
      if (seite === "kalender") return "kalender";
      if (seite === "listen" || (seite === null && aktivId !== null)) return "listen";
      return "start";   // Start und Wochenübersicht
    }

    function geheZu(tab) {
      aktivId = null;
      seite = tab === "start" ? null : tab;
      neuesProjektOffen = false;
      anzeigen();
      window.scrollTo(0, 0);
    }

    function tabsZeichnen() {
      const nav = document.getElementById("tabs");
      nav.hidden = !freigegeben();
      if (nav.hidden) return;
      const aktiv = aktiverTab();
      const innen = el("div", "tabs-innen");
      TABS.forEach((t) => {
        const knopf = el("button", "tab" + (t.id === aktiv ? " aktiv" : ""));
        knopf.type = "button";
        knopf.dataset.tab = t.id;
        knopf.innerHTML = TAB_SYMBOLE[t.id];
        knopf.appendChild(el("span", "", t.name));
        if (t.id === aktiv) knopf.setAttribute("aria-current", "page");
        knopf.addEventListener("click", () => geheZu(t.id));
        innen.appendChild(knopf);
      });
      nav.replaceChildren(innen);
    }

    function anzeigen() {
      // Ohne Anmeldung zeigt die App nichts von den Daten
      if (!freigegeben()) {
        ansicht.replaceChildren(zugangAnsicht());
        tabsZeichnen();
        return;
      }
      let inhalt;
      if (seite === "einstellungen") {
        inhalt = einstellungenAnsicht();
      } else if (seite === "woche") {
        inhalt = wochenAnsicht();
      } else if (seite === "kalender") {
        inhalt = kalenderAnsicht();
      } else if (seite === "listen") {
        inhalt = listenAnsicht();
      } else {
        const p = aktivesProjekt();
        if (!p) aktivId = null;
        inhalt = p ? projektAnsicht(p) : startAnsicht();
      }
      ansicht.replaceChildren(inhalt);
      tabsZeichnen();
      dekoAufbauen();
      speichern();
    }

    function oeffnen(id) {
      aktivId = id;
      seite = null;
      neuesProjektOffen = false;
      anzeigen();
      window.scrollTo(0, 0);
    }

    // ----- Start: Rangliste, Notizbrett und kleine Zusammenfassung -----
    function startAnsicht() {
      const wurzel = el("div", "ansicht");
      wurzel.append(punkteTafel(), tafelFuss(), brett(), zusammenfassung());
      return wurzel;
    }

    // ----- Projekte: Checklisten und Notizen als Kästchen -----
    const abschnittZu = { liste: false, notiz: false };   // eingeklappt?

    function projektAbschnitt(typ, titel) {
      const eintraege = projekte.filter((p) => (p.typ === "notiz") === (typ === "notiz"));
      const zu = abschnittZu[typ];

      const abschnitt = el("section", "projekt-abschnitt");
      abschnitt.setAttribute("aria-label", titel);
      const umschalter = el("button", "abschnitt-umschalter");
      umschalter.type = "button";
      umschalter.setAttribute("aria-expanded", zu ? "false" : "true");
      umschalter.append(
        el("span", "abschnitt-pfeil", zu ? "▸" : "▾"),
        el("h3", "", titel),
        el("span", "abschnitt-zahl", eintraege.length)
      );
      umschalter.addEventListener("click", () => {
        abschnittZu[typ] = !zu;
        anzeigen();
      });
      abschnitt.appendChild(umschalter);

      if (!zu) {
        const raster = el("div", "raster");
        eintraege.forEach((p) => raster.appendChild(projektKarte(p)));
        raster.appendChild(neuKarte(typ));
        abschnitt.appendChild(raster);
      }
      return abschnitt;
    }

    function listenAnsicht() {
      const wurzel = el("div", "ansicht");
      const kopf = el("div", "abschnitt-kopf");
      kopf.append(
        el("h2", "abschnitt-titel", "Projekte"),
        el("span", "abschnitt-zahl", projekte.length),
        stickerKnopf("pfote", "st-rechts")
      );
      wurzel.append(kopf, projektAbschnitt("liste", "Checklisten"), projektAbschnitt("notiz", "Notizen"));
      return wurzel;
    }

    // Wie steht es um das Zuhause?
    function statusInfo() {
      const heute = heuteIso();
      let offen = 0, ueberfaellig = 0, heuteFaellig = 0;
      projekte.forEach((p) => p.aufgaben.forEach((a) => {
        if (a.erledigt) return;
        offen++;
        if (a.datum) {
          if (a.datum < heute) ueberfaellig++;
          else if (a.datum === heute) heuteFaellig++;
        }
      }));

      if (offen === 0) return { text: "Alles erledigt. Zuhause ist im Griff!", warn: false };
      if (ueberfaellig > 0) {
        return { text: ueberfaellig + " überfällig" + (heuteFaellig ? " · " + heuteFaellig + " heute fällig" : "") + " · " + offen + " offen", warn: true };
      }
      if (heuteFaellig > 0) return { text: heuteFaellig + " heute fällig · " + offen + " offen", warn: false };
      return { text: "Alles im Griff · " + offen + " offen", warn: false };
    }

    // Rangliste der Woche, kompakt: Wer diese Woche mehr Punkte hat, ist auf Platz 1
    function punkteTafel() {
      const tafel = el("section", "tafel kompakt");
      tafel.setAttribute("aria-label", "Rangliste der Woche");

      const von = wochenStart();
      const bis = wochenStart(1);
      const woche = personen.map((x) => punkteVon(x.id, von, bis));
      const gesamt = personen.map((x) => punkteVon(x.id));
      const siege = personen.map((x) => wochenSiege(x.id));
      const gleich = woche[0] === woche[1];
      const reihenfolge = woche[1] > woche[0] ? [1, 0] : [0, 1];

      reihenfolge.forEach((i, pos) => {
        const person = personen[i];
        const stufe = levelVon(gesamt[i]);
        const bin = geraet.ich === person.id;
        const vorne = !gleich && pos === 0;

        const kachel = el("button", "person" + (bin ? " ich" : "") + (vorne ? " platz1" : ""));
        kachel.type = "button";
        setFarbe(kachel, PERSONEN_FARBEN[i]);
        kachel.setAttribute("aria-pressed", bin ? "true" : "false");
        kachel.setAttribute("aria-label", person.name + ": " + woche[i] + " Punkte diese Woche. Punkte als " + person.name + " sammeln.");

        const kopf = el("div", "person-kopf");
        const bild = el("img", "avatar");
        bild.src = STICKER[i === 0 ? "herz" : "gaehnend"];
        bild.alt = "";
        kopf.append(bild, el("span", "person-name", person.name));
        if (bin) kopf.appendChild(el("span", "du-marke", "du"));

        let rang = "";
        if (woche[0] + woche[1] > 0) rang = gleich ? "Gleichstand" : vorne ? "♛ Platz 1" : "Platz 2";
        const zeile = el("div", "person-zeile");
        const punkte = el("div", "person-punkte", "★ " + woche[i]);
        punkte.appendChild(el("small", "", " diese Woche"));
        zeile.appendChild(punkte);
        if (rang) zeile.appendChild(el("span", "rang" + (vorne ? " erste" : ""), rang));

        const klein = el("div", "person-woche", "Gesamt ★ " + gesamt[i] + " · Level " + stufe.nummer + " · Siege " + siege[i]);

        kachel.append(kopf, zeile, klein);
        kachel.addEventListener("click", () => {
          if (geraet.ich === person.id || !wechselErlaubt()) return;
          geraet.ich = person.id;
          anzeigen();
          toast("Du sammelst jetzt als " + person.name + ".");
        });
        tafel.appendChild(kachel);
      });
      return tafel;
    }

    // Eine schmale Zeile unter der Rangliste: Preis und Link zur Wochenübersicht
    function tafelFuss() {
      const fuss = el("div", "tafel-fuss");
      if (preis) fuss.appendChild(el("p", "preis", "Preis der Woche: " + preis));
      const knopf = el("button", "pille klein", "Diese Woche ›");
      knopf.setAttribute("aria-label", "Erledigt diese Woche ansehen");
      knopf.addEventListener("click", () => {
        wochenOffset = 0;
        seite = "woche";
        anzeigen();
        window.scrollTo(0, 0);
      });
      fuss.appendChild(knopf);
      return fuss;
    }

    // ----- Notizbrett: kurze Nachrichten für euch beide -----
    let boardAlle = false;

    function notizZeit(iso) {
      const d = new Date(iso);
      const uhr = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
      const gestern = new Date();
      gestern.setDate(gestern.getDate() - 1);
      if (isoVon(d) === heuteIso()) return "heute " + uhr;
      if (isoVon(d) === isoVon(gestern)) return "gestern " + uhr;
      return d.toLocaleDateString("de-CH", { weekday: "short", day: "numeric", month: "numeric" }) + " " + uhr;
    }

    function brett() {
      const karte = el("section", "aufgabenkarte brett");
      karte.setAttribute("aria-label", "Notizbrett");
      const kopf = el("div", "brett-kopf");
      kopf.appendChild(el("h3", "", "Notizbrett"));
      karte.appendChild(kopf);

      const neu = el("div", "brett-neu");
      const feld = el("input");
      feld.type = "text";
      feld.maxLength = 140;
      feld.placeholder = "Etwas für uns beide notieren …";
      feld.autocomplete = "off";
      feld.setAttribute("aria-label", "Neue Notiz");
      const knopf = el("button", "knopf", "Posten");
      const posten = () => {
        const text = feld.value.trim();
        if (text === "") return;
        notizen.unshift({ id: neueId(), text: text, von: geraet.ich, zeit: new Date().toISOString() });
        if (notizen.length > 40) notizen.length = 40;
        anzeigen();
      };
      knopf.addEventListener("click", posten);
      feld.addEventListener("keydown", (e) => { if (e.key === "Enter") posten(); });
      neu.append(feld, knopf);
      karte.appendChild(neu);

      if (notizen.length === 0) {
        karte.appendChild(el("p", "hinweis-text", "Noch nichts am Brett. Schreib zum Beispiel «Milch ist alle» oder «Heute Pizza?»."));
        return karte;
      }

      const liste = el("ul", "notizen");
      (boardAlle ? notizen : notizen.slice(0, 4)).forEach((n, i) => {
        const li = el("li", "notiz");
        setFarbe(li, PERSONEN_FARBEN[n.von === "b" ? 1 : 0]);
        li.style.setProperty("--neig", i % 2 === 0 ? "-0.6deg" : "0.6deg");
        li.appendChild(el("div", "notiz-text", n.text));
        li.appendChild(el("div", "notiz-meta", nameVon(n.von) + " · " + notizZeit(n.zeit)));
        const weg = el("button", "notiz-weg", "×");
        weg.type = "button";
        weg.title = "Notiz löschen";
        weg.setAttribute("aria-label", "Notiz löschen: " + n.text);
        weg.addEventListener("click", () => {
          notizen = notizen.filter((x) => x.id !== n.id);
          anzeigen();
        });
        li.appendChild(weg);
        liste.appendChild(li);
      });
      karte.appendChild(liste);

      if (notizen.length > 4) {
        const mehr = el("button", "pille klein", boardAlle ? "Weniger anzeigen" : "Alle " + notizen.length + " Notizen ›");
        mehr.addEventListener("click", () => {
          boardAlle = !boardAlle;
          anzeigen();
        });
        karte.appendChild(mehr);
      }
      return karte;
    }

    // ----- Ganz unten: kleine Zusammenfassung von Projekten und Kalender -----
    function tagLabel(d) {
      const morgen = new Date();
      morgen.setDate(morgen.getDate() + 1);
      if (isoVon(d) === heuteIso()) return "Heute";
      if (isoVon(d) === isoVon(morgen)) return "Morgen";
      return d.toLocaleDateString("de-CH", { weekday: "short", day: "numeric", month: "numeric" });
    }

    function zusammenfassung() {
      const karte = el("section", "aufgabenkarte uebersicht");
      karte.setAttribute("aria-label", "Auf einen Blick");
      karte.appendChild(el("h3", "", "Auf einen Blick"));
      const info = statusInfo();
      karte.appendChild(el("p", "uebersicht-status" + (info.warn ? " warn" : ""), info.text));

      const raster = el("div", "uebersicht-raster");

      // Checklisten und Notizen
      const listen = el("div", "uebersicht-teil");
      const zeileFuer = (p) => {
        const offen = p.aufgaben.filter((a) => !a.erledigt).length;
        const zeile = el("button", "uebersicht-zeile");
        zeile.type = "button";
        setFarbe(zeile, farbeVon(p));
        const rechts = p.typ === "notiz"
          ? (p.bearbeitetAm ? notizZeit(p.bearbeitetAm) : "leer")
          : offen === 0 ? "alles erledigt" : offen + " offen";
        zeile.append(
          el("span", "uebersicht-punkt"),
          el("span", "uebersicht-name", p.name + (p.punkte ? " ★" : "")),
          el("span", "uebersicht-zahl", rechts)
        );
        zeile.addEventListener("click", () => oeffnen(p.id));
        return zeile;
      };
      const checklisten = projekte.filter((p) => p.typ !== "notiz");
      const notizProjekte = projekte.filter((p) => p.typ === "notiz");
      listen.appendChild(el("h4", "", "Checklisten"));
      checklisten.forEach((p) => listen.appendChild(zeileFuer(p)));
      if (checklisten.length === 0) listen.appendChild(el("p", "hinweis-text", "Noch keine Checklisten."));
      if (notizProjekte.length > 0) {
        listen.appendChild(el("h4", "uebersicht-unter", "Notizen"));
        notizProjekte.forEach((p) => listen.appendChild(zeileFuer(p)));
      }
      raster.appendChild(listen);

      // Kalender: heute und die nächsten Tage
      const kal = el("div", "uebersicht-teil");
      kal.appendChild(el("h4", "", "Kalender"));
      const jetzt = new Date();
      const heute0 = new Date(jetzt.getFullYear(), jetzt.getMonth(), jetzt.getDate());
      const tag = tagesEintraege(heute0);
      const spaeter = termineImZeitraum(tag.bis, new Date(heute0.getFullYear(), heute0.getMonth(), heute0.getDate() + 8)).slice(0, 3);
      const zeilen = [];
      tag.termine.slice(0, 3).forEach((t) => zeilen.push({ wann: "Heute", zeit: t.ganztag ? "ganztägig" : uhrzeit(t.start), titel: t.titel, farbe: kalenderFarbe(t.kalender) }));
      tag.aufgaben.slice(0, 2).forEach((e) => zeilen.push({ wann: "Heute", zeit: "Aufgabe", titel: e.a.text, farbe: "#7A6A12" }));
      spaeter.forEach((t) => zeilen.push({ wann: tagLabel(t.start), zeit: t.ganztag ? "ganztägig" : uhrzeit(t.start), titel: t.titel, farbe: kalenderFarbe(t.kalender) }));

      if (zeilen.length === 0) {
        if (kalender.length > 0) kal.appendChild(el("p", "hinweis-text", "In den nächsten Tagen steht nichts an."));
      } else {
        zeilen.slice(0, 5).forEach((z) => {
          const zeile = el("div", "uebersicht-zeile statisch");
          zeile.style.setProperty("--k", z.farbe);
          zeile.append(
            el("span", "uebersicht-balken"),
            el("span", "uebersicht-wann", z.wann + " · " + z.zeit),
            el("span", "uebersicht-name", z.titel)
          );
          kal.appendChild(zeile);
        });
      }
      if (kalender.length === 0) kal.appendChild(el("p", "hinweis-text", "Noch kein Kalender verknüpft."));
      const oeffnenKnopf = el("button", "pille klein", kalender.length === 0 ? "Kalender verknüpfen ›" : "Kalender öffnen ›");
      oeffnenKnopf.addEventListener("click", () => geheZu(kalender.length === 0 ? "einstellungen" : "kalender"));
      kal.appendChild(oeffnenKnopf);
      raster.appendChild(kal);

      karte.appendChild(raster);
      const status = el("p", "sync-status");
      setzeSyncStatus(status);
      karte.appendChild(status);
      return karte;
    }

    function notizKarte(p) {
      const karte = el("article", "projekt notiz-projekt");
      setFarbe(karte, farbeVon(p));
      karte.tabIndex = 0;
      karte.setAttribute("role", "button");
      karte.setAttribute("aria-label", "Notiz öffnen: " + p.name);

      const kopf = el("div", "projekt-kopf");
      kopf.append(el("span", "icon", "✎"), el("h3", "projekt-name", p.name), el("span", "stern-pille", "Notiz"));

      const text = (p.text || "").trim();
      karte.append(kopf, el("p", "projekt-vorschau", text !== "" ? text : "Noch leer"));
      if (p.bearbeitetAm) karte.appendChild(el("p", "projekt-stand", "Bearbeitet " + notizZeit(p.bearbeitetAm)));

      karte.addEventListener("click", () => oeffnen(p.id));
      karte.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          oeffnen(p.id);
        }
      });
      return karte;
    }

    function projektKarte(p) {
      if (p.typ === "notiz") return notizKarte(p);
      const karte = el("article", "projekt");
      setFarbe(karte, farbeVon(p));
      karte.tabIndex = 0;
      karte.setAttribute("role", "button");
      karte.setAttribute("aria-label", "Projekt öffnen: " + p.name);

      const kopf = el("div", "projekt-kopf");
      kopf.append(el("span", "icon", p.name.charAt(0).toUpperCase()), el("h3", "projekt-name", p.name));
      if (p.punkte) {
        // Nur ein kleiner Stern, damit der Name des Projekts Platz behält
        const stern = el("span", "stern-pille", "★");
        stern.title = "Ranked";
        stern.setAttribute("aria-label", "Ranked");
        kopf.appendChild(stern);
      }

      const vorschau = el("ul", "vorschau");
      p.aufgaben.filter((a) => !a.erledigt).slice(0, 2).forEach((a) => {
        vorschau.appendChild(el("li", "", a.text));
      });

      karte.append(kopf, el("p", "projekt-stand", standText(p)), balkenBauen(p), vorschau);

      karte.addEventListener("click", () => oeffnen(p.id));
      karte.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          oeffnen(p.id);
        }
      });
      return karte;
    }

    // Das «+»-Kästchen für eine Art (liste oder notiz). Ist es geöffnet, zeigt es das Eingabefeld.
    function neuKarte(typ) {
      if (!(neuesProjektOffen && neuesProjektTyp === typ)) {
        const text = typ === "notiz" ? "Neue Notiz" : "Neue Checkliste";
        const karte = el("div", "projekt neu");
        karte.tabIndex = 0;
        karte.setAttribute("role", "button");
        karte.setAttribute("aria-label", text + " erstellen");
        karte.append(el("span", "plus-kreis", "+"), el("span", "", text));
        const aufmachen = () => {
          neuesProjektOffen = true;
          neuesProjektTyp = typ;
          neuesProjektRanked = false;
          anzeigen();
        };
        karte.addEventListener("click", aufmachen);
        karte.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            aufmachen();
          }
        });
        return karte;
      }

      const istNotiz = typ === "notiz";
      const karte = el("div", "projekt neu offen");
      karte.appendChild(el("strong", "neu-titel", istNotiz ? "Neue Notiz" : "Neue Checkliste"));

      const feld = el("input");
      feld.type = "text";
      feld.placeholder = istNotiz ? "Titel der Notiz" : "Name der Checkliste";
      feld.autocomplete = "off";
      feld.setAttribute("aria-label", istNotiz ? "Titel der neuen Notiz" : "Name der neuen Checkliste");

      const erstellen = el("button", "knopf klein", "Erstellen");
      const abbrechen = el("button", "pille leise", "Abbrechen");

      erstellen.addEventListener("click", () => projektErstellen(feld.value));
      abbrechen.addEventListener("click", () => {
        neuesProjektOffen = false;
        anzeigen();
      });
      feld.addEventListener("keydown", (e) => {
        if (e.key === "Enter") projektErstellen(feld.value);
        if (e.key === "Escape") {
          neuesProjektOffen = false;
          anzeigen();
        }
      });

      if (istNotiz) {
        karte.append(feld, erstellen, abbrechen);
        setTimeout(() => feld.focus(), 0);
        return karte;
      }

      // Ranked: Die Punkte dieser Checkliste zählen für die Rangliste
      const rankedKnopf = el("button", "pille klein" + (neuesProjektRanked ? " an" : ""), neuesProjektRanked ? "★ Ranked: an" : "★ Ranked: aus");
      rankedKnopf.type = "button";
      rankedKnopf.setAttribute("aria-pressed", neuesProjektRanked ? "true" : "false");
      rankedKnopf.title = "Ranked: Die Punkte dieser Checkliste zählen für die Rangliste der Woche.";
      rankedKnopf.addEventListener("click", () => {
        neuesProjektRanked = !neuesProjektRanked;
        rankedKnopf.classList.toggle("an", neuesProjektRanked);
        rankedKnopf.textContent = neuesProjektRanked ? "★ Ranked: an" : "★ Ranked: aus";
        rankedKnopf.setAttribute("aria-pressed", neuesProjektRanked ? "true" : "false");
        feld.focus();
      });

      karte.append(feld, rankedKnopf, erstellen, abbrechen);

      const vorhanden = projekte.map((x) => x.name.toLowerCase());
      const frei = VORLAGEN.filter((v) => !vorhanden.includes(v.name.toLowerCase()));
      if (frei.length > 0) {
        const bereich = el("div", "vorlagen");
        bereich.appendChild(el("span", "vorlagen-titel", "Oder mit Vorlage starten (zählt als Ranked):"));
        frei.forEach((v) => {
          const b = el("button", "pille klein", v.name);
          b.addEventListener("click", () => projektAusVorlage(v));
          bereich.appendChild(b);
        });
        karte.appendChild(bereich);
      }
      setTimeout(() => feld.focus(), 0);
      return karte;
    }

    function projektErstellen(name) {
      name = name.trim();
      if (name === "") return;

      const notiz = neuesProjektTyp === "notiz";
      const p = {
        id: naechsteId++, farbe: naechsteFarbe(), typ: notiz ? "notiz" : "liste", name: name,
        punkte: notiz ? false : neuesProjektRanked, wert: 10, aufgaben: [],
      };
      if (notiz) p.text = "";
      neuesProjektRanked = false;
      neuesProjektTyp = "liste";
      projekte.push(p);
      fokusZiel = notiz ? "notiztext" : "aufgabe";   // gleich losschreiben können
      oeffnen(p.id);
    }

    function projektAusVorlage(v) {
      const p = {
        id: naechsteId++, farbe: naechsteFarbe(), name: v.name, punkte: v.punkte, wert: 10,
        aufgaben: routinenAufgaben(v.name),
      };
      projekte.push(p);
      oeffnen(p.id);
    }

    function projektLoeschen(p) {
      const istNotiz = p.typ === "notiz";
      if (istNotiz ? (p.text || "").trim() !== "" : p.aufgaben.length > 0) {
        const ok = confirm(
          istNotiz
            ? "Notiz «" + p.name + "» löschen?"
            : "Checkliste «" + p.name + "» mit " + p.aufgaben.length + " Aufgabe(n) löschen?"
        );
        if (!ok) return;
      }
      projekte = projekte.filter((x) => x.id !== p.id);
      aktivId = null;
      seite = "listen";
      anzeigen();
    }

    // ----- Geöffnetes Projekt -----
    // Text direkt in der Liste bearbeiten (Enter = speichern, Esc = abbrechen)
    function bearbeitenStarten(element, objekt, feldName, extraKlasse) {
      const feld = el("input", "bearbeiten-feld" + (extraKlasse ? " " + extraKlasse : ""));
      feld.type = "text";
      feld.value = objekt[feldName];
      feld.setAttribute("aria-label", "Text bearbeiten");
      element.replaceWith(feld);
      feld.focus();
      feld.select();

      let fertig = false;
      function abschliessen(uebernehmen) {
        if (fertig) return;
        fertig = true;
        const neuerText = feld.value.trim();
        if (uebernehmen && neuerText !== "") objekt[feldName] = neuerText;
        anzeigen();
      }

      feld.addEventListener("keydown", (e) => {
        if (e.key === "Enter") abschliessen(true);
        if (e.key === "Escape") abschliessen(false);
      });
      feld.addEventListener("blur", () => abschliessen(true));
    }

    function stiftKnopf(beschriftung, beiKlick) {
      const b = el("button", "icon-knopf", "✎");
      b.title = "Bearbeiten";
      b.setAttribute("aria-label", beschriftung);
      b.addEventListener("click", beiKlick);
      return b;
    }

    function loeschKnopf(beschriftung, klein, beiKlick) {
      const b = el("button", "entfernen" + (klein ? " klein" : ""), "×");
      b.title = "Entfernen";
      b.setAttribute("aria-label", beschriftung);
      b.addEventListener("click", beiKlick);
      return b;
    }

    function checkbox(objekt, beschriftung, beiAenderung) {
      const haken = el("input", "haken");
      haken.type = "checkbox";
      haken.checked = objekt.erledigt;
      haken.setAttribute("aria-label", beschriftung + objekt.text);
      haken.addEventListener("change", () => {
        objekt.erledigt = haken.checked;
        beiAenderung(objekt.erledigt, haken);
        anzeigen();
      });
      return haken;
    }

    // Punkte-Schalter im Projektkopf
    function punkteZeile(p) {
      const zeile = el("div", "punkte-zeile");

      const schalter = el("button", "pille klein" + (p.punkte ? " an" : ""), p.punkte ? "★ Ranked: an" : "★ Ranked: aus");
      schalter.setAttribute("aria-pressed", p.punkte ? "true" : "false");
      schalter.addEventListener("click", () => {
        p.punkte = !p.punkte;
        anzeigen();
      });
      zeile.appendChild(schalter);

      if (p.punkte) {
        const wert = el("input", "wert-feld");
        wert.type = "number";
        wert.min = "1";
        wert.max = "100";
        wert.value = p.wert;
        wert.setAttribute("aria-label", "Punkte pro Aufgabe");
        wert.addEventListener("change", () => {
          const n = Math.round(Number(wert.value));
          if (n >= 1 && n <= 100) p.wert = n;
          anzeigen();
        });

        zeile.append(wert, el("span", "", "Punkte pro Aufgabe"));
        if (wechselErlaubt()) {
          const wer = el("button", "pille klein", "Du sammelst als " + nameVon(geraet.ich) + " ⇄");
          wer.addEventListener("click", () => {
            const andere = personen.find((x) => x.id !== geraet.ich);
            geraet.ich = andere.id;
            anzeigen();
          });
          zeile.appendChild(wer);
        } else {
          zeile.appendChild(el("span", "", "· Du sammelst als " + nameVon(geraet.ich)));
        }
      }
      zeile.appendChild(el(
        "span", "ranked-hinweis",
        p.punkte ? "Die Punkte dieses Projekts zählen für die Rangliste der Woche."
                 : "Aus: Aufgaben in diesem Projekt geben keine Punkte."
      ));
      return zeile;
    }

    // Eine Notiz: freies Textfeld, speichert von selbst
    function notizAnsicht(p) {
      const wurzel = el("div", "ansicht projektseite notizseite");
      setFarbe(wurzel, farbeVon(p));

      const leiste = el("div", "leiste");
      const zurueck = el("button", "pille", "‹ Projekte");
      zurueck.addEventListener("click", () => {
        aktivId = null;
        seite = "listen";
        anzeigen();
      });
      const loeschen = el("button", "pille leise", "Notiz löschen");
      loeschen.addEventListener("click", () => projektLoeschen(p));
      leiste.append(zurueck, stickerKnopf(OBEN_HUNDE[p.id % 3], "st-oben"), loeschen);

      const kopf = el("section", "seitenkopf");
      const titelZeile = el("div", "titelzeile");
      const titel = el("h2", "seitentitel", p.name);
      titel.addEventListener("dblclick", () => bearbeitenStarten(titel, p, "name", "seitentitel-feld"));
      titelZeile.append(
        el("span", "icon gross", "✎"),
        titel,
        stiftKnopf("Titel bearbeiten", () => bearbeitenStarten(titel, p, "name", "seitentitel-feld"))
      );
      const info = el("p", "projekt-stand");
      const infoAktualisieren = () => {
        info.textContent = p.bearbeitetAm
          ? "Zuletzt bearbeitet von " + nameVon(p.bearbeitetVon) + " · " + notizZeit(p.bearbeitetAm)
          : "Noch leer. Schreib unten los, es wird automatisch gespeichert.";
      };
      infoAktualisieren();
      kopf.append(titelZeile, info);

      const karte = el("section", "aufgabenkarte notizkarte");
      const feld = el("textarea", "notiz-editor");
      feld.value = p.text || "";
      feld.placeholder = "Schreib hier los …";
      feld.setAttribute("aria-label", "Text der Notiz " + p.name);
      const anpassen = () => {
        feld.style.height = "auto";
        feld.style.height = Math.max(feld.scrollHeight + 4, 220) + "px";
      };
      let timer = null;
      const sichern = () => {
        if (feld.value === (p.text || "")) return;
        p.text = feld.value;
        p.bearbeitetVon = geraet.ich;
        p.bearbeitetAm = new Date().toISOString();
        speichern();
        infoAktualisieren();
      };
      feld.addEventListener("input", () => {
        anpassen();
        clearTimeout(timer);
        timer = setTimeout(sichern, 500);
      });
      feld.addEventListener("blur", () => {
        clearTimeout(timer);
        sichern();
      });
      karte.appendChild(feld);
      karte.appendChild(el("p", "hinweis-text", "Wird automatisch gespeichert. Bitte nicht gleichzeitig mit der anderen Person in derselben Notiz schreiben, sonst gewinnt die neuere Änderung."));

      wurzel.append(leiste, kopf, karte);
      setTimeout(() => {
        anpassen();
        if (fokusZiel === "notiztext") {
          fokusZiel = null;
          feld.focus();
        }
      }, 0);
      return wurzel;
    }

    function projektAnsicht(p) {
      if (p.typ === "notiz") return notizAnsicht(p);
      const wurzel = el("div", "ansicht projektseite");
      setFarbe(wurzel, farbeVon(p));

      // Obere Leiste
      const leiste = el("div", "leiste");
      const zurueck = el("button", "pille", "‹ Projekte");
      zurueck.addEventListener("click", () => {
        aktivId = null;
        seite = "listen";
        anzeigen();
      });
      const loeschen = el("button", "pille leise", "Projekt löschen");
      loeschen.addEventListener("click", () => projektLoeschen(p));
      leiste.append(zurueck, stickerKnopf(OBEN_HUNDE[p.id % 3], "st-oben"), loeschen);

      // Kopf des Projekts
      const kopf = el("section", "seitenkopf");
      const titelZeile = el("div", "titelzeile");
      const titel = el("h2", "seitentitel", p.name);
      titel.addEventListener("dblclick", () => bearbeitenStarten(titel, p, "name", "seitentitel-feld"));
      titelZeile.append(
        el("span", "icon gross", p.name.charAt(0).toUpperCase()),
        titel,
        stiftKnopf("Projektname bearbeiten", () => bearbeitenStarten(titel, p, "name", "seitentitel-feld"))
      );
      const stand = zaehlen(p);
      if (stand.gesamt > 0 && stand.fertig === stand.gesamt) {
        titelZeile.appendChild(stickerKnopf("herz", "st-herz"));
      }
      kopf.append(titelZeile, el("p", "projekt-stand", standText(p)), balkenBauen(p), punkteZeile(p));

      // Aufgabenliste
      const karte = el("section", "aufgabenkarte");
      karte.setAttribute("aria-label", "Aufgaben");

      const offene = p.aufgaben.filter((a) => !a.erledigt);
      const erledigte = p.aufgaben
        .filter((a) => a.erledigt)
        .sort((x, y) => String(y.erledigtAm || "").localeCompare(String(x.erledigtAm || "")));

      if (p.aufgaben.length === 0) {
        const leerBlock = el("div", "leer-block");
        leerBlock.append(
          stickerKnopf("gaehnend", "st-gaehnend"),
          el("p", "leer", "Noch keine Aufgaben. Schreib unten die erste hinein.")
        );
        karte.appendChild(leerBlock);
      } else {
        if (offene.length > 0) {
          const liste = el("ul", "aufgaben");
          offene.forEach((a) => liste.appendChild(aufgabenZeile(p, a)));
          karte.appendChild(liste);
        } else {
          karte.appendChild(el("p", "leer", "Alles erledigt. Zuhause ist im Griff!"));
        }
        if (erledigte.length > 0) {
          const bereich = el("details", "erledigt-bereich");
          bereich.open = erledigtOffen.has(p.id);
          bereich.appendChild(el("summary", "", "Erledigt (" + erledigte.length + ")"));
          const liste = el("ul", "aufgaben");
          erledigte.forEach((a) => liste.appendChild(aufgabenZeile(p, a)));
          bereich.appendChild(liste);
          bereich.addEventListener("toggle", () => {
            if (bereich.open) erledigtOffen.add(p.id);
            else erledigtOffen.delete(p.id);
          });
          karte.appendChild(bereich);
        }
      }

      const routinen = routinenBereich(p);
      if (routinen) karte.appendChild(routinen);

      // Neue Aufgabe (mit optionalem Fälligkeitsdatum und Wiederholung)
      const neu = el("div", "zeile neu-aufgabe");
      const feld = el("input");
      feld.type = "text";
      feld.placeholder = "Neue Aufgabe";
      feld.autocomplete = "off";
      feld.setAttribute("aria-label", "Neue Aufgabe");
      const datum = el("input", "datum-feld");
      datum.type = "date";
      datum.setAttribute("aria-label", "Fällig am (optional)");
      datum.title = "Fällig am (optional)";
      let neueWiederholung = null;
      const wiederholung = wiederholungsFeld(null, (code) => { neueWiederholung = code; }, true);
      const knopf = el("button", "knopf", "Hinzufügen");

      function hinzufuegen() {
        const text = feld.value.trim();
        if (text === "") return;
        p.aufgaben.push({
          id: neueId(), text: text, erledigt: false,
          datum: datum.value || (neueWiederholung ? heuteIso() : null),
          fuer: null, wiederholung: neueWiederholung, unter: [],
        });
        fokusZiel = "aufgabe";
        anzeigen();
      }

      knopf.addEventListener("click", hinzufuegen);
      feld.addEventListener("keydown", (e) => {
        if (e.key === "Enter") hinzufuegen();
      });
      neu.append(el("span", "plus-zeichen", "+"), feld, datum, wiederholung, knopf);
      karte.appendChild(neu);

      if (fokusZiel === "aufgabe") {
        fokusZiel = null;
        setTimeout(() => feld.focus(), 0);
      }

      wurzel.append(leiste, kopf, karte);
      return wurzel;
    }

    function aufgabenZeile(p, aufgabe) {
      // Ältere gespeicherte Aufgaben haben noch keine Unteraufgaben
      if (!Array.isArray(aufgabe.unter)) aufgabe.unter = [];

      const li = el("li", "aufgabe" + (aufgabe.erledigt ? " erledigt" : ""));
      const reihe = el("div", "reihe");

      const haken = checkbox(aufgabe, "Erledigt: ", (erledigt) => aufgabeAbhaken(p, aufgabe, erledigt));

      const span = el("span", "text", aufgabe.text);
      span.addEventListener("dblclick", () => bearbeitenStarten(span, aufgabe, "text"));

      // Auf-/Zuklappen der Details und Unteraufgaben, mit Fortschritt (z. B. 1/3)
      const offen = offeneAufgaben.has(aufgabe);
      const fertigeUnter = aufgabe.unter.filter((u) => u.erledigt).length;
      const aufklappen = el(
        "button",
        "aufklappen",
        (aufgabe.unter.length > 0 ? fertigeUnter + "/" + aufgabe.unter.length + " " : "") +
          (offen ? "▾" : "▸")
      );
      aufklappen.title = "Details und Unteraufgaben";
      aufklappen.setAttribute("aria-expanded", offen ? "true" : "false");
      aufklappen.setAttribute("aria-label", "Details und Unteraufgaben von: " + aufgabe.text);
      aufklappen.addEventListener("click", () => {
        if (offeneAufgaben.has(aufgabe)) offeneAufgaben.delete(aufgabe);
        else offeneAufgaben.add(aufgabe);
        anzeigen();
      });

      reihe.append(
        haken,
        span,
        aufklappen,
        stiftKnopf("Bearbeiten: " + aufgabe.text, () => bearbeitenStarten(span, aufgabe, "text")),
        loeschKnopf("Entfernen: " + aufgabe.text, false, () => {
          if (aufgabe.erledigt && aufgabe.erledigtAm &&
              !confirm("Diese Aufgabe zählt für die Wochenübersicht und die Punkte. Wirklich entfernen?")) return;
          p.aufgaben.splice(p.aufgaben.indexOf(aufgabe), 1);
          anzeigen();
        })
      );
      li.appendChild(reihe);

      // Kleine Infos unter dem Text: Punkte, Datum, Zuständigkeit
      const meta = el("div", "meta");
      if (p.punkte) {
        const erreicht = aufgabe.erledigt && aufgabe.punkte;
        meta.appendChild(el(
          "span", "meta-chip" + (erreicht ? " erreicht" : ""),
          erreicht ? "★ " + aufgabe.punkte + " für " + nameVon(aufgabe.erledigtVon) : "★ " + p.wert
        ));
      }
      if (aufgabe.datum) {
        const ueberfaellig = !aufgabe.erledigt && aufgabe.datum < heuteIso();
        meta.appendChild(el(
          "span", "meta-chip" + (ueberfaellig ? " ueberfaellig" : ""),
          (ueberfaellig ? "Überfällig · " : "Fällig · ") + formatDatum(aufgabe.datum)
        ));
      }
      if (aufgabe.fuer) meta.appendChild(el("span", "meta-chip", "Für " + nameVon(aufgabe.fuer)));
      if (regelLesen(aufgabe.wiederholung)) meta.appendChild(el("span", "meta-chip", "↻ " + regelText(aufgabe.wiederholung)));
      if (meta.children.length > 0) li.appendChild(meta);

      if (offen) li.appendChild(unterAufgabenBauen(p, aufgabe));
      return li;
    }

    // Fälligkeitsdatum und Zuständigkeit
    function detailsBauen(aufgabe) {
      const bereich = el("div", "details");

      const l1 = el("label", "detail");
      l1.appendChild(el("span", "", "Fällig"));
      const datum = el("input");
      datum.type = "date";
      datum.value = aufgabe.datum || "";
      datum.addEventListener("change", () => {
        aufgabe.datum = datum.value || null;
        anzeigen();
      });
      l1.appendChild(datum);

      const l2 = el("label", "detail");
      l2.appendChild(el("span", "", "Zuständig"));
      const wahl = el("select");
      [["", "niemand"]].concat(personen.map((x) => [x.id, x.name])).forEach(([wert, text]) => {
        const option = el("option", "", text);
        option.value = wert;
        wahl.appendChild(option);
      });
      wahl.value = aufgabe.fuer || "";
      wahl.addEventListener("change", () => {
        aufgabe.fuer = wahl.value || null;
        anzeigen();
      });
      l2.appendChild(wahl);

      const l3 = el("div", "detail");
      l3.appendChild(el("span", "", "Wiederholen"));
      l3.appendChild(wiederholungsFeld(aufgabe.wiederholung, (code) => {
        aufgabe.wiederholung = code;
        anzeigen();
      }, false));

      bereich.append(l1, l2, l3);
      return bereich;
    }

    // Bereich mit Details und Unteraufgaben einer Aufgabe
    function unterAufgabenBauen(p, aufgabe) {
      const panel = el("div", "unter");
      panel.appendChild(detailsBauen(aufgabe));

      aufgabe.unter.forEach((u, index) => {
        const reihe = el("div", "unterreihe" + (u.erledigt ? " erledigt" : ""));
        const span = el("span", "text", u.text);
        span.addEventListener("dblclick", () => bearbeitenStarten(span, u, "text"));

        reihe.append(
          checkbox(u, "Erledigt: ", (erledigt) => {
            // Sind alle Teile erledigt, ist auch die ganze Aufgabe erledigt
            if (erledigt && !aufgabe.erledigt && aufgabe.unter.every((x) => x.erledigt)) {
              aufgabe.erledigt = true;
              aufgabeAbhaken(p, aufgabe, true, "«" + aufgabe.text + "» ist komplett erledigt!");
            }
          }),
          span,
          stiftKnopf("Unteraufgabe bearbeiten: " + u.text, () => bearbeitenStarten(span, u, "text")),
          loeschKnopf("Unteraufgabe entfernen: " + u.text, true, () => {
            aufgabe.unter.splice(index, 1);
            anzeigen();
          })
        );
        panel.appendChild(reihe);
      });

      // Textfeld für neue Unteraufgabe
      const neuZeile = el("div", "zeile unterneu");
      const feld = el("input");
      feld.type = "text";
      feld.placeholder = "Unteraufgabe hinzufügen";
      feld.autocomplete = "off";
      feld.setAttribute("aria-label", "Neue Unteraufgabe");
      const plusKnopf = el("button", "knopf klein", "+");
      plusKnopf.setAttribute("aria-label", "Unteraufgabe hinzufügen");

      function unterHinzufuegen() {
        const text = feld.value.trim();
        if (text === "") return;
        aufgabe.unter.push({ text: text, erledigt: false });
        fokusAuf = aufgabe;
        anzeigen();
      }

      plusKnopf.addEventListener("click", unterHinzufuegen);
      feld.addEventListener("keydown", (e) => {
        if (e.key === "Enter") unterHinzufuegen();
      });
      neuZeile.append(feld, plusKnopf);
      panel.appendChild(neuZeile);

      // Nach dem Hinzufügen bleibt der Cursor im Textfeld
      if (fokusAuf === aufgabe) {
        fokusAuf = null;
        setTimeout(() => feld.focus(), 0);
      }
      return panel;
    }

    // ----- Wochenübersicht: Was wurde erledigt? Wer ist vorne? -----
    function wochenAnsicht() {
      const wurzel = el("div", "ansicht wochenseite");

      const leiste = el("div", "leiste");
      const zurueck = el("button", "pille", "‹ Start");
      zurueck.addEventListener("click", () => {
        seite = null;
        anzeigen();
      });
      leiste.appendChild(zurueck);

      const von = wochenStart(wochenOffset);
      const bis = wochenStart(wochenOffset + 1);
      const letzterTag = new Date(bis);
      letzterTag.setDate(letzterTag.getDate() - 1);
      const kurz = { day: "numeric", month: "short" };
      const bereichText = von.toLocaleDateString("de-CH", kurz) + " – " + letzterTag.toLocaleDateString("de-CH", kurz);
      const titelText = wochenOffset === 0 ? "Diese Woche" : wochenOffset === -1 ? "Letzte Woche" : "Woche " + isoWoche(von);

      // Wochen wechseln
      const nav = el("div", "wochen-nav");
      const zurWoche = el("button", "pille", "‹");
      zurWoche.setAttribute("aria-label", "Vorherige Woche");
      zurWoche.addEventListener("click", () => {
        wochenOffset--;
        anzeigen();
      });
      const mitte = el("div", "wochen-titel");
      mitte.append(el("div", "", titelText), el("div", "wochen-bereich", bereichText + " · KW " + isoWoche(von)));
      const weiter = el("button", "pille", "›");
      weiter.setAttribute("aria-label", "Nächste Woche");
      weiter.disabled = wochenOffset >= 0;
      weiter.addEventListener("click", () => {
        wochenOffset++;
        anzeigen();
      });
      nav.append(zurWoche, mitte, weiter);

      // Alles, was in dieser Woche erledigt wurde
      const eintraege = [];
      projekte.forEach((p) => p.aufgaben.forEach((a) => {
        if (a.erledigt && a.erledigtAm) {
          const t = new Date(a.erledigtAm);
          if (t >= von && t < bis) eintraege.push({ p: p, a: a, t: t });
        }
      }));
      eintraege.sort((x, y) => x.t - y.t);

      const punkte = personen.map((x) => eintraege.filter((e) => e.a.erledigtVon === x.id).reduce((summe, e) => summe + (e.a.punkte || 0), 0));
      const anzahl = personen.map((x) => eintraege.filter((e) => e.a.erledigtVon === x.id).length);
      const gleich = punkte[0] === punkte[1];
      const reihenfolge = punkte[1] > punkte[0] ? [1, 0] : [0, 1];

      const tafel = el("section", "tafel");
      reihenfolge.forEach((i, pos) => {
        const vorne = !gleich && pos === 0;
        const kachel = el("div", "person statisch" + (vorne ? " platz1" : ""));
        setFarbe(kachel, PERSONEN_FARBEN[i]);
        const kopf = el("div", "person-kopf");
        const bild = el("img", "avatar");
        bild.src = STICKER[i === 0 ? "herz" : "gaehnend"];
        bild.alt = "";
        kopf.append(bild, el("span", "person-name", personen[i].name));
        const zeile = el("div", "person-zeile");
        zeile.appendChild(el("div", "person-punkte", "★ " + punkte[i]));
        if (punkte[0] + punkte[1] > 0) {
          zeile.appendChild(el("span", "rang" + (vorne ? " erste" : ""), gleich ? "Gleichstand" : vorne ? "♛ Platz 1" : "Platz 2"));
        }
        kachel.append(kopf, zeile, el("div", "person-woche", anzahl[i] + " Aufgabe(n) erledigt"));
        tafel.appendChild(kachel);
      });

      wurzel.append(leiste, nav, tafel);

      if (eintraege.length === 0) {
        const leerBlock = el("div", "leer-block");
        leerBlock.append(
          stickerKnopf("gaehnend", "st-gaehnend"),
          el("p", "leer", wochenOffset === 0 ? "Diese Woche wurde noch nichts erledigt." : "In dieser Woche wurde nichts erledigt.")
        );
        wurzel.appendChild(el("section", "aufgabenkarte", "")).appendChild(leerBlock);
        return wurzel;
      }

      // Nach Tagen gruppiert
      const karte = el("section", "aufgabenkarte");
      karte.appendChild(el("p", "wochen-summe", eintraege.length + " Aufgabe(n) erledigt"));
      let letzterSchluessel = "";
      let liste = null;
      eintraege.forEach((e) => {
        const schluessel = isoVon(e.t);
        if (schluessel !== letzterSchluessel) {
          letzterSchluessel = schluessel;
          karte.appendChild(el("h3", "wochen-tag", e.t.toLocaleDateString("de-CH", { weekday: "long", day: "numeric", month: "long" })));
          liste = el("ul", "erledigt-liste");
          karte.appendChild(liste);
        }
        const zeile = el("li", "erledigt-zeile");
        setFarbe(zeile, farbeVon(e.p));
        const inhalt = el("div", "erledigt-inhalt");
        inhalt.appendChild(el("span", "text", e.a.text));
        const meta = el("div", "meta");
        meta.append(el("span", "meta-chip", e.p.name), el("span", "meta-chip", nameVon(e.a.erledigtVon)));
        if (e.a.punkte) meta.appendChild(el("span", "meta-chip erreicht", "★ " + e.a.punkte));
        inhalt.appendChild(meta);
        zeile.append(el("span", "haken-zeichen", "✓"), inhalt);
        liste.appendChild(zeile);
      });
      wurzel.appendChild(karte);
      return wurzel;
    }

    // ----- Kalender: Monatsansicht mit Terminen und Aufgaben -----
    function uhrzeit(d) {
      return d.toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit" });
    }

    // Jede Person hat ihre Farbe (wie bei den Punkte-Kacheln)
    function kalenderFarbe(k) {
      return PERSONEN_FARBEN[k.person === "b" ? 1 : 0].haupt;
    }

    // Termine und fällige Aufgaben eines Tages
    function tagesEintraege(von, nurPerson) {
      const bis = new Date(von.getFullYear(), von.getMonth(), von.getDate() + 1);
      const iso = isoVon(von);
      const termine = termineImZeitraum(von, bis, nurPerson).sort((a, b) => (b.ganztag - a.ganztag) || (a.start - b.start));
      const aufgaben = [];
      projekte.forEach((p) => p.aufgaben.forEach((a) => {
        if (!a.erledigt && a.datum === iso) aufgaben.push({ p: p, a: a });
      }));
      return { von: von, bis: bis, termine: termine, aufgaben: aufgaben };
    }

    function terminZeitText(t, von, bis) {
      if (t.ganztag) return "Ganztägig";
      if (t.start < von) return "bis " + uhrzeit(t.ende);
      if (t.ende > bis) return "ab " + uhrzeit(t.start);
      return t.ende > t.start ? uhrzeit(t.start) + " – " + uhrzeit(t.ende) : uhrzeit(t.start);
    }

    function terminZeile(t, von, bis) {
      const zeile = el("li", "kal-eintrag");
      zeile.style.setProperty("--k", kalenderFarbe(t.kalender));
      const inhalt = el("div", "kal-inhalt");
      inhalt.appendChild(el("div", "kal-titel", t.titel));
      inhalt.appendChild(el("div", "kal-zeit", terminZeitText(t, von, bis) + (t.ort ? " · " + t.ort : "")));
      const meta = el("div", "meta");
      meta.appendChild(el("span", "meta-chip", nameVon(t.kalender.person)));
      inhalt.appendChild(meta);
      zeile.append(el("span", "kal-balken"), inhalt);
      return zeile;
    }

    function aufgabeZeile(eintrag) {
      const zeile = el("li", "kal-eintrag");
      zeile.style.setProperty("--k", "#7A6A12");
      const knopf = el("button", "kal-inhalt kal-aufgabe");
      knopf.type = "button";
      knopf.appendChild(el("div", "kal-titel", eintrag.a.text));
      const meta = el("div", "meta");
      meta.append(el("span", "meta-chip", "Aufgabe"), el("span", "meta-chip", eintrag.p.name));
      if (eintrag.a.fuer) meta.appendChild(el("span", "meta-chip", "Für " + nameVon(eintrag.a.fuer)));
      knopf.appendChild(meta);
      knopf.addEventListener("click", () => oeffnen(eintrag.p.id));
      zeile.append(el("span", "kal-balken"), knopf);
      return zeile;
    }

    function kalenderAnsicht() {
      const wurzel = el("div", "ansicht kalenderseite");
      const heute = new Date();
      if (!kalenderMonat) kalenderMonat = new Date(heute.getFullYear(), heute.getMonth(), 1);
      if (!kalenderTag) kalenderTag = heuteIso();

      // Obere Leiste
      const leiste = el("div", "leiste");
      const zurueck = el("button", "pille", "‹ Start");
      zurueck.addEventListener("click", () => {
        seite = null;
        anzeigen();
      });
      const aktualisieren = el("button", "pille klein", "Aktualisieren");
      aktualisieren.addEventListener("click", async () => {
        aktualisieren.disabled = true;
        await kalenderAktualisieren(true);
        anzeigen();
      });
      leiste.append(zurueck, aktualisieren);

      // Monat wechseln
      const kopf = el("div", "kal-kopf");
      const vorher = el("button", "pille", "‹");
      vorher.setAttribute("aria-label", "Vorheriger Monat");
      vorher.addEventListener("click", () => {
        kalenderMonat = new Date(kalenderMonat.getFullYear(), kalenderMonat.getMonth() - 1, 1);
        anzeigen();
      });
      const nachher = el("button", "pille", "›");
      nachher.setAttribute("aria-label", "Nächster Monat");
      nachher.addEventListener("click", () => {
        kalenderMonat = new Date(kalenderMonat.getFullYear(), kalenderMonat.getMonth() + 1, 1);
        anzeigen();
      });
      const titel = el("div", "kal-monat", kalenderMonat.toLocaleDateString("de-CH", { month: "long", year: "numeric" }));
      const heuteKnopf = el("button", "pille klein", "Heute");
      heuteKnopf.addEventListener("click", () => {
        kalenderMonat = new Date(heute.getFullYear(), heute.getMonth(), 1);
        kalenderTag = heuteIso();
        anzeigen();
      });
      kopf.append(vorher, titel, heuteKnopf, nachher);

      // Wessen Termine? «Beide» zeigt alles in einem gemeinsamen Kalender
      const filterZeile = el("div", "kal-filter");
      [["alle", "Beide"], ["a", personen[0].name], ["b", personen[1].name]].forEach(([wert, text]) => {
        const knopf = el("button", "pille klein" + (kalenderFilter === wert ? " an" : ""), text);
        knopf.setAttribute("aria-pressed", kalenderFilter === wert ? "true" : "false");
        knopf.addEventListener("click", () => {
          kalenderFilter = wert;
          anzeigen();
        });
        filterZeile.appendChild(knopf);
      });

      // Raster mit 6 Wochen
      const erster = new Date(kalenderMonat.getFullYear(), kalenderMonat.getMonth(), 1);
      const von = new Date(erster.getFullYear(), erster.getMonth(), 1 - ((erster.getDay() + 6) % 7));
      const bis = new Date(von.getFullYear(), von.getMonth(), von.getDate() + 42);

      const punkte = {};
      const eintrag = (iso) => (punkte[iso] = punkte[iso] || { kalender: new Set(), aufgaben: 0 });
      termineImZeitraum(von, bis, kalenderFilter).forEach((t) => tageVon(t.start, t.ende).forEach((tag) => eintrag(tag).kalender.add(t.kalender.id)));
      projekte.forEach((p) => p.aufgaben.forEach((a) => { if (!a.erledigt && a.datum) eintrag(a.datum).aufgaben++; }));

      const raster = el("div", "kal-raster");
      ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].forEach((t) => raster.appendChild(el("div", "kal-wochentag", t)));
      const heuteIsoText = heuteIso();
      for (let i = 0; i < 42; i++) {
        const tag = new Date(von.getFullYear(), von.getMonth(), von.getDate() + i);
        const iso = isoVon(tag);
        const zelle = el("button", "kal-tag" +
          (tag.getMonth() !== kalenderMonat.getMonth() ? " ausserhalb" : "") +
          (iso === heuteIsoText ? " heute" : "") +
          (iso === kalenderTag ? " gewaehlt" : ""));
        zelle.type = "button";
        zelle.setAttribute("aria-label", tag.toLocaleDateString("de-CH", { weekday: "long", day: "numeric", month: "long" }));
        zelle.appendChild(el("span", "", tag.getDate()));
        const dots = el("span", "kal-punkte");
        const info = punkte[iso];
        if (info) {
          Array.from(info.kalender).slice(0, 3).forEach((id) => {
            const k = kalender.find((x) => x.id === id);
            const punkt = el("span", "kal-punkt");
            punkt.style.background = k ? kalenderFarbe(k) : "#999";
            dots.appendChild(punkt);
          });
          if (info.aufgaben > 0) dots.appendChild(el("span", "kal-punkt aufgabe"));
        }
        zelle.appendChild(dots);
        zelle.addEventListener("click", () => {
          kalenderTag = iso;
          if (tag.getMonth() !== kalenderMonat.getMonth()) kalenderMonat = new Date(tag.getFullYear(), tag.getMonth(), 1);
          anzeigen();
        });
        raster.appendChild(zelle);
      }

      const rasterKarte = el("section", "aufgabenkarte");
      rasterKarte.append(kopf, filterZeile, raster);

      // Legende und Status
      const legende = el("div", "kal-legende");
      if (kalender.length > 0) {
        personen.forEach((person, i) => {
          const eintragLegende = el("span", "kal-legende-eintrag");
          const punkt = el("span", "kal-punkt");
          punkt.style.background = PERSONEN_FARBEN[i].haupt;
          eintragLegende.append(punkt, document.createTextNode(" " + person.name));
          legende.appendChild(eintragLegende);
        });
      }
      const aufgabenLegende = el("span", "kal-legende-eintrag");
      aufgabenLegende.append(el("span", "kal-punkt aufgabe"), document.createTextNode(" Aufgabe fällig"));
      legende.appendChild(aufgabenLegende);
      rasterKarte.appendChild(legende);

      kalender.forEach((k) => {
        const e = kalenderEintrag(k.id);
        if (e.fehler) rasterKarte.appendChild(el("p", "fehlertext", nameVon(k.person) + ": " + e.fehler));
      });
      if (kalender.length === 0) {
        const hinweis = el("p", "hinweis-text", "Noch kein Kalender verknüpft. ");
        const knopf = el("button", "pille klein", "Apple Kalender verknüpfen ›");
        knopf.addEventListener("click", () => {
          seite = "einstellungen";
          anzeigen();
          window.scrollTo(0, 0);
        });
        hinweis.appendChild(knopf);
        rasterKarte.appendChild(hinweis);
      }

      // Der gewählte Tag
      const gewaehlt = datumVon(kalenderTag);
      const tag = tagesEintraege(gewaehlt, kalenderFilter);
      const tagKarte = el("section", "aufgabenkarte");
      tagKarte.appendChild(el("h3", "kal-tag-titel", gewaehlt.toLocaleDateString("de-CH", { weekday: "long", day: "numeric", month: "long" })));
      if (tag.termine.length === 0 && tag.aufgaben.length === 0) {
        tagKarte.appendChild(el("p", "leer", "An diesem Tag steht nichts an."));
      } else {
        const liste = el("ul", "kal-liste");
        tag.termine.forEach((t) => liste.appendChild(terminZeile(t, tag.von, tag.bis)));
        tag.aufgaben.forEach((e) => liste.appendChild(aufgabeZeile(e)));
        tagKarte.appendChild(liste);
      }

      wurzel.append(leiste, rasterKarte, tagKarte);
      return wurzel;
    }

    // «Heute»-Karte auf der Startseite
    function heuteKarte() {
      const karte = el("section", "aufgabenkarte heute-karte");
      const jetzt = new Date();
      const tag = tagesEintraege(new Date(jetzt.getFullYear(), jetzt.getMonth(), jetzt.getDate()));

      const kopf = el("div", "heute-kopf");
      kopf.appendChild(el("h3", "", "Heute · " + jetzt.toLocaleDateString("de-CH", { weekday: "long", day: "numeric", month: "long" })));
      const oeffnenKnopf = el("button", "pille klein", "Kalender ›");
      oeffnenKnopf.addEventListener("click", () => {
        seite = "kalender";
        anzeigen();
        window.scrollTo(0, 0);
      });
      kopf.appendChild(oeffnenKnopf);
      karte.appendChild(kopf);

      if (tag.termine.length === 0 && tag.aufgaben.length === 0) {
        if (kalender.length > 0) karte.appendChild(el("p", "leer", "Heute steht nichts an."));
      } else {
        const liste = el("ul", "kal-liste");
        tag.termine.slice(0, 5).forEach((t) => liste.appendChild(terminZeile(t, tag.von, tag.bis)));
        tag.aufgaben.slice(0, 5).forEach((e) => liste.appendChild(aufgabeZeile(e)));
        karte.appendChild(liste);
        const mehr = tag.termine.length - 5;
        if (mehr > 0) karte.appendChild(el("p", "hinweis-text", "… und " + mehr + " weitere Termine"));
      }
      kalender.forEach((k) => {
        const e = kalenderEintrag(k.id);
        if (e.fehler && !e.zeit) karte.appendChild(el("p", "fehlertext", nameVon(k.person) + ": " + e.fehler));
      });
      if (kalender.length === 0) {
        const hinweis = el("p", "hinweis-text", "Verknüpfe euren Apple Kalender, dann siehst du hier auch die Termine von heute. ");
        const knopf = el("button", "pille klein", "Jetzt verknüpfen ›");
        knopf.addEventListener("click", () => {
          seite = "einstellungen";
          anzeigen();
          window.scrollTo(0, 0);
        });
        hinweis.appendChild(knopf);
        karte.appendChild(hinweis);
      }
      return karte;
    }

    // ----- Einstellungen: Apple Kalender verknüpfen -----
    // Der Kalender einer Person (wird erst beim ersten Link angelegt)
    function kalenderVonPerson(personId, anlegen) {
      let k = kalender.find((x) => x.person === personId);
      if (!k && anlegen) {
        k = { id: neueId(), person: personId, name: nameVon(personId), url: "", farbe: personId === "b" ? 1 : 0 };
        kalender.push(k);
      }
      return k || null;
    }

    function kalenderBlock(person, i) {
      const k = kalenderVonPerson(person.id, false);
      const block = el("div", "kal-einstellung");

      const kopf = el("div", "kal-einst-kopf");
      const punkt = el("span", "kal-punkt gross");
      punkt.style.background = PERSONEN_FARBEN[i].haupt;
      kopf.append(punkt, el("strong", "", "Kalender von " + person.name + (person.id === geraet.ich ? " (du)" : "")));

      const url = el("input");
      url.type = "text";
      url.value = k ? k.url : "";
      url.placeholder = "webcal://… oder https://…";
      url.autocomplete = "off";
      url.setAttribute("aria-label", "Kalender-Link von " + person.name);
      url.addEventListener("change", async () => {
        const eintrag = kalenderVonPerson(person.id, true);
        eintrag.url = url.value.trim();
        kalenderEintrag(eintrag.id).fehler = null;
        anzeigen();
        if (eintrag.url) {
          await kalenderLaden(eintrag);
          kalenderNeuZeichnen();
        }
      });

      const status = el("p", "kal-status");
      if (k) {
        status.dataset.id = k.id;
        status.textContent = kalenderStatusText(k);
        status.classList.toggle("fehler", !!kalenderEintrag(k.id).fehler);
      } else {
        status.textContent = "Noch kein Kalender verknüpft.";
      }

      const knoepfe = el("div", "feld-zeile");
      const neuLaden = el("button", "pille klein", "Neu laden");
      neuLaden.addEventListener("click", async () => {
        if (!k) return;
        await kalenderLaden(k);
        kalenderNeuZeichnen();
      });
      const datei = el("input");
      datei.type = "file";
      datei.accept = ".ics,text/calendar";
      datei.hidden = true;
      const dateiKnopf = el("button", "pille klein", "Datei laden");
      dateiKnopf.addEventListener("click", () => datei.click());
      datei.addEventListener("change", () => {
        const f = datei.files && datei.files[0];
        if (!f) return;
        const leser = new FileReader();
        leser.onload = () => {
          const text = String(leser.result);
          const eintrag = kalenderVonPerson(person.id, true);
          if (text.indexOf("BEGIN:VCALENDAR") < 0) {
            kalenderEintrag(eintrag.id).fehler = "Das ist keine Kalender-Datei (.ics).";
          } else {
            kalenderUebernehmen(eintrag, text, "datei");
            cacheSchreiben(eintrag.id, text);
          }
          anzeigen();
        };
        leser.readAsText(f);
      });
      const entfernen = el("button", "pille klein leise", "Entfernen");
      entfernen.addEventListener("click", () => {
        if (!k) return;
        if (!confirm("Kalender von " + person.name + " entfernen?")) return;
        kalender = kalender.filter((x) => x.id !== k.id);
        delete kalenderDaten[k.id];

    // Der Weiterleitungsdienst: holt den iCloud-Kalender und reicht ihn an die App weiter
    function workerCode() {
      const herkunft = location.origin && location.origin !== "null" ? location.origin : "*";
      return [
        "export default {",
        "  async fetch(request) {",
        "    const cors = { 'Access-Control-Allow-Origin': '" + herkunft + "', 'Vary': 'Origin' };",
        "    if (request.method === 'OPTIONS') {",
        "      return new Response(null, { headers: Object.assign({ 'Access-Control-Allow-Methods': 'GET', 'Access-Control-Allow-Headers': '*' }, cors) });",
        "    }",
        "    const ziel = new URL(request.url).searchParams.get('url');",
        "    if (!ziel) return new Response('Parameter url fehlt', { status: 400, headers: cors });",
        "    let adresse;",
        "    try { adresse = new URL(ziel.replace(/^webcal:/i, 'https:')); }",
        "    catch (e) { return new Response('Ungueltige Adresse', { status: 400, headers: cors }); }",
        "    const host = adresse.hostname;",
        "    if (adresse.protocol !== 'https:' || !(host === 'icloud.com' || host.endsWith('.icloud.com'))) {",
        "      return new Response('Nur iCloud-Kalender erlaubt', { status: 403, headers: cors });",
        "    }",
        "    const antwort = await fetch(adresse.toString(), { headers: { 'User-Agent': 'Mozilla/5.0' }, redirect: 'follow' });",
        "    const text = await antwort.text();",
        "    return new Response(text, { status: antwort.status, headers: Object.assign({ 'Content-Type': 'text/calendar; charset=utf-8', 'Cache-Control': 'public, max-age=300' }, cors) });",
        "  }",
        "};",
      ].join("\n");
    }

    // ----- Wiederholung wählen (für neue Aufgaben und in den Details) -----
    function wiederholungsFeld(startCode, beiAenderung, mitSymbol) {
      const huelle = el("span", "wdh-feld");

        option.value = wert;
        wahl.appendChild(option);
      });
      const eigeneOption = el("option", "", "eigene …");
      eigeneOption.value = "eigene";
      wahl.appendChild(eigeneOption);

      const regel = regelLesen(startCode);
      const istVorgabe = WIEDERHOLUNGEN.some((w) => w[0] === (startCode || ""));
      wahl.value = !startCode ? "" : istVorgabe ? startCode : "eigene";

      const eigen = el("span", "wdh-eigen");
      const zahl = el("input");
      zahl.type = "number";
      zahl.min = "1";
      zahl.max = "99";
      zahl.value = regel ? regel.n : 2;
      zahl.setAttribute("aria-label", "Anzahl");
      const einheit = el("select");
      einheit.setAttribute("aria-label", "Einheit");
      [["tage", "Tage"], ["wochen", "Wochen"], ["monate", "Monate"]].forEach(([wert, text]) => {
        const option = el("option", "", text);
        option.value = wert;
        einheit.appendChild(option);
      });
      einheit.value = regel ? regel.einheit : "tage";
      eigen.append(el("span", "", "alle"), zahl, einheit);
      eigen.hidden = wahl.value !== "eigene";

      const melden = () => {
        let code = wahl.value;
        if (code === "eigene") {
          const n = Math.max(1, Math.min(99, parseInt(zahl.value, 10) || 1));
          code = "jede:" + n + ":" + einheit.value;
        }
        beiAenderung(code || null);
      };
      wahl.addEventListener("change", () => {
        eigen.hidden = wahl.value !== "eigene";
        melden();
      });
      zahl.addEventListener("change", melden);
      einheit.addEventListener("change", melden);

      huelle.append(wahl, eigen);
      return huelle;
    }

      const fehlend = (ROUTINEN[p.name.trim().toLowerCase()] || []).filter(
        (r) => !p.aufgaben.some((a) => a.text.toLowerCase() === r.text.toLowerCase())

    // Aufgabe als erledigt markieren (oder zurücknehmen): Punkte, nächste Wiederholung, Konfetti
    function aufgabeAbhaken(p, aufgabe, erledigt, vorspann) {
      if (erledigt) {
        const vorher = punkteVon(geraet.ich);
        aufgabe.erledigtVon = geraet.ich;
        aufgabe.erledigtAm = new Date().toISOString();
        if (p.punkte) aufgabe.punkte = p.wert;
        else delete aufgabe.punkte;

        const meldung = [];
        if (vorspann) meldung.push(vorspann);
        if (p.punkte) meldung.push(belohnenText(vorher, aufgabe.punkte));

        // Wiederkehrende Aufgabe: die nächste wird gleich angelegt
        if (regelLesen(aufgabe.wiederholung)) {
          const folge = {
            id: neueId(), text: aufgabe.text, erledigt: false,
            datum: naechstesDatum(aufgabe.datum, aufgabe.wiederholung),
            fuer: aufgabe.fuer || null, wiederholung: aufgabe.wiederholung,
            unter: aufgabe.unter.map((u) => ({ text: u.text, erledigt: false })),
          };
          p.aufgaben.splice(p.aufgaben.indexOf(aufgabe) + 1, 0, folge);
          aufgabe.folgeId = folge.id;
          meldung.push("Nächstes Mal: " + formatDatum(folge.datum));
        }

        konfettiStarten();
        if (meldung.length > 0) toast(meldung.join(" · "));
      } else {
        // Haken weg = Punkte weg, die automatisch angelegte nächste Aufgabe auch
        delete aufgabe.erledigtVon;
        delete aufgabe.erledigtAm;
        delete aufgabe.punkte;
        if (aufgabe.folgeId) {
          const i = p.aufgaben.findIndex((x) => x.id === aufgabe.folgeId && !x.erledigt);
          if (i >= 0) p.aufgaben.splice(i, 1);
          delete aufgabe.folgeId;
        }
      }
    }
