      feldA.value = meineIndex === 0 ? k.uid : "";
      const feldB = el("input");
      feldB.type = "text";
      feldB.placeholder = "User UID von Beni";
      feldB.value = meineIndex === 1 ? k.uid : "";
      const regeln = el("pre");
      const aktualisieren = () => { regeln.textContent = regelnText(feldA.value.trim(), feldB.value.trim()); };
      aktualisieren();
      feldA.addEventListener("input", aktualisieren);
      feldB.addEventListener("input", aktualisieren);
      const kopierKnopf = el("button", "pille klein", "Regeln kopieren");
      kopierKnopf.addEventListener("click", () => kopieren(regeln.textContent, "Regeln kopiert."));
      regelnBereich.append(feldA, feldB, regeln, kopierKnopf);
      box.appendChild(regelnBereich);

      // Einrichtung fest in die Datei schreiben
      const fest = el("details", "kal-profi");
      fest.appendChild(el("summary", "", "Einrichtung fest in die Datei schreiben"));
      fest.appendChild(el("p", "hinweis-text", "Damit nicht jedes Gerät eingerichtet werden muss, trägst du diese Zeilen in index.html bei «const FIREBASE_FEST = null;» ein. Danach fragt die App nur noch nach E-Mail und Passwort. Der Web-API-Schlüssel ist laut Firebase kein Geheimnis. Geschützt sind die Daten durch die Regeln."));
      const snippet = el("pre");
      snippet.textContent = "const FIREBASE_FEST = " + JSON.stringify({ dbUrl: k.dbUrl, apiKey: k.apiKey, emails: k.emails }, null, 2) + ";";
      const snippetKopieren = el("button", "pille klein", "Kopieren");
      snippetKopieren.addEventListener("click", () => kopieren(snippet.textContent, "Kopiert."));
      fest.append(snippet, snippetKopieren);
      box.appendChild(fest);

      box.appendChild(el("p", "hinweis-text", "Hinweis: Auf einem gemeinsam genutzten Gerät bitte abmelden. Dann werden die Daten dort gelöscht."));
      return box;
    }

    // ----- Einstellungen: Personen, Kalender, Gemeinsam nutzen, Backup -----
    function einstellungKarte(titel, ...inhalt) {
      const karte = el("section", "aufgabenkarte einst-karte");
      karte.appendChild(el("h3", "", titel));
      karte.append(...inhalt);
      return karte;
    }

    function einstellungenAnsicht() {
      const wurzel = el("div", "ansicht einstellungen");

      const leiste = el("div", "leiste");
      const zurueck = el("button", "pille", "‹ Start");
      zurueck.addEventListener("click", () => {
        seite = null;
        anzeigen();
      });
      leiste.appendChild(zurueck);

      wurzel.append(
        leiste,
        einstellungKarte("Personen und Punkte", personenInhalt()),
        einstellungKarte("Konto und Zugang", kontoInhalt()),
        einstellungKarte("Apple Kalender verknüpfen", kalenderVerknuepfenInhalt()),
        einstellungKarte("Aufgaben in den Kalender exportieren", kalenderInhalt()),
        einstellungKarte("Auf dem Handy nutzen", handyInhalt()),
        einstellungKarte("Backup", backupInhalt())
      );
      return wurzel;
    }

    function personenInhalt() {
      const box = el("div");
      box.appendChild(el("p", "", "Wer angemeldet ist, bekommt die Punkte für die Aufgaben, die er abhakt."));
      personen.forEach((person, i) => {
        const zeile = el("div", "person-feld");
        const bild = el("img", "avatar");
        bild.src = STICKER[i === 0 ? "herz" : "gaehnend"];
        bild.alt = "";
        const feld = el("input");
        feld.type = "text";
        feld.value = person.name;
        feld.maxLength = 24;
        feld.setAttribute("aria-label", "Name von Person " + (i + 1));
        feld.addEventListener("change", () => {
          person.name = feld.value.trim() || STANDARD_NAMEN[i];
          anzeigen();
        });
        zeile.append(bild, feld);
        box.appendChild(zeile);
      });
      box.appendChild(el("p", "", "Preis der Woche (steht auf der Startseite):"));
      const preisFeld = el("input");
      preisFeld.type = "text";
      preisFeld.value = preis;
      preisFeld.maxLength = 80;
      preisFeld.placeholder = "z. B. Wer gewinnt, wünscht sich das Abendessen";
      preisFeld.setAttribute("aria-label", "Preis der Woche");
      preisFeld.addEventListener("change", () => {
        preis = preisFeld.value.trim();
        anzeigen();
      });
      box.appendChild(preisFeld);
      box.appendChild(el("p", "hinweis-text", "Platz 1 bekommt, wer in der Woche (Montag bis Sonntag) mehr Punkte gesammelt hat. Punkte gibt es nur in Projekten, bei denen «Ranked» eingeschaltet ist."));
      return box;
    }

    function kalenderInhalt() {
      const box = el("div");
      box.appendChild(el("p", "", "Alle offenen Aufgaben mit Fälligkeitsdatum werden als ganztägige Termine in eine Datei geschrieben. Diese Datei funktioniert mit Google Kalender, Apple Kalender und Outlook."));
      const knopf = el("button", "knopf", "Kalender-Datei (.ics) laden");
      knopf.addEventListener("click", kalenderExportieren);
      box.appendChild(knopf);
      box.appendChild(el("p", "hinweis-text", "Google Kalender: Einstellungen → Importieren & Exportieren → Importieren. Apple Kalender: Datei doppelklicken. Outlook: Datei → Öffnen & Exportieren → Importieren."));
      box.appendChild(el("p", "hinweis-text", "Du und Beni könnt dieselbe Datei in euren eigenen Kalender importieren. Das ist ein Import, kein ständiger Abgleich: Importiere am besten in einen eigenen Kalender und ersetze ihn bei Änderungen durch einen neuen Import."));
      return box;
    }

    function backupInhalt() {
      const box = el("div");
      box.appendChild(el("p", "", "Sichere alle Aufgaben als Datei oder lade ein Backup. So kannst du die Liste auch ohne gemeinsamen Speicher von einem Gerät aufs andere bringen."));
      const zeile = el("div", "feld-zeile");
      const sichern = el("button", "pille", "Daten sichern (.json)");
      sichern.addEventListener("click", datenSichern);
      const ladeKnopf = el("button", "pille", "Backup laden");
      const datei = el("input");
      datei.type = "file";
      datei.accept = ".json,application/json";
      datei.hidden = true;
      ladeKnopf.addEventListener("click", () => datei.click());
      datei.addEventListener("change", () => {
        const f = datei.files && datei.files[0];
        if (!f) return;
        const leser = new FileReader();
        leser.onload = () => datenAusText(String(leser.result));
        leser.readAsText(f);
      });
      zeile.append(sichern, ladeKnopf, datei);
      box.appendChild(zeile);
      return box;
    }

    // ---------- Hunde-Sticker: Bellen & Hüpfen ----------
    let audioCtx = null;
    let rauschen = null;

    // Das Bellen wird direkt im Browser erzeugt (keine Sounddatei nötig)
    function wuff(start, kraft, tonlage) {
      const ctx = audioCtx;

      // Stimme: Sägezahn-Ton mit fallender Tonhöhe
      const osc = ctx.createOscillator();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(520 * tonlage, start);
      osc.frequency.exponentialRampToValueAtTime(190 * tonlage, start + 0.16);

      // Formant-Filter: klingt wie ein Maul
      const formant = ctx.createBiquadFilter();
      formant.type = "bandpass";
      formant.Q.value = 3;
      formant.frequency.setValueAtTime(900, start);
      formant.frequency.exponentialRampToValueAtTime(500, start + 0.18);

      const stimme = ctx.createGain();
      stimme.gain.setValueAtTime(0.0001, start);
      stimme.gain.exponentialRampToValueAtTime(0.9 * kraft, start + 0.015);
      stimme.gain.exponentialRampToValueAtTime(0.0001, start + 0.2);

      osc.connect(formant);
      formant.connect(stimme);
      stimme.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.22);

      // Etwas Rauschen für den rauen Klang
      if (!rauschen) {
        rauschen = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.25), ctx.sampleRate);
        const daten = rauschen.getChannelData(0);
        for (let i = 0; i < daten.length; i++) daten[i] = Math.random() * 2 - 1;
      }
      const quelle = ctx.createBufferSource();
      quelle.buffer = rauschen;
      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = 1100;
      filter.Q.value = 1;
      const rauschGain = ctx.createGain();
      rauschGain.gain.setValueAtTime(0.0001, start);
      rauschGain.gain.exponentialRampToValueAtTime(0.3 * kraft, start + 0.01);
      rauschGain.gain.exponentialRampToValueAtTime(0.0001, start + 0.14);
      quelle.connect(filter);
      filter.connect(rauschGain);
      rauschGain.connect(ctx.destination);
      quelle.start(start);
      quelle.stop(start + 0.2);
    }

    // Das echte Bellen von Frodo. Geht das nicht, springt der künstliche Ton ein.
    let letzterTon = null;
    function bellen() {
      try {
        if (letzterTon) letzterTon.pause();
        const ton = new Audio(BELLEN);
        letzterTon = ton;
        const spielt = ton.play();
        if (spielt && spielt.catch) spielt.catch(() => bellenSynthese());
      } catch (fehler) {
        bellenSynthese();
      }
    }

    function bellenSynthese() {
      try {
        const AudioKlasse = window.AudioContext || window.webkitAudioContext;
        if (!AudioKlasse) return;
        if (!audioCtx) audioCtx = new AudioKlasse();
        if (audioCtx.state === "suspended") audioCtx.resume();

        const start = audioCtx.currentTime + 0.02;
        const tonlage = 0.9 + Math.random() * 0.25;   // jedes Mal etwas anders
        wuff(start, 1, tonlage);
        wuff(start + 0.27, 0.85, tonlage * 0.95);
      } catch (fehler) {
        console.warn("Ton konnte nicht abgespielt werden:", fehler);
      }
    }

    function hundReagiert(knopf) {
      bellen();

      // Sticker hüpft und wird kurz grösser
      knopf.classList.remove("huepft");
      void knopf.offsetWidth;   // Animation neu starten
      knopf.classList.add("huepft");

      const blase = el("span", "bubble", Math.random() < 0.5 ? "Wuff!" : "Wuff wuff!");
      knopf.appendChild(blase);
      setTimeout(() => blase.remove(), 900);
    }

    function stickerKnopf(name, klasse) {
      const knopf = el("button", "sticker-knopf " + klasse);
      knopf.type = "button";
      knopf.setAttribute("aria-label", "Hund streicheln");
      const bild = el("img");
      bild.src = STICKER[name];
      bild.alt = "";
      bild.draggable = false;
      knopf.appendChild(bild);
      knopf.addEventListener("click", () => hundReagiert(knopf));
      knopf.addEventListener("animationend", (e) => {
        if (e.animationName === "huepf") knopf.classList.remove("huepft");
      });
      return knopf;
    }

    // Hunde auf dem Hügel: frei verteilt, je Seite andere Hunde und Plätze
    const dekoReihe = document.getElementById("deko-reihe");
    const DEKO_START = [
      ["schlafend", "left:7%; bottom:20px"],
      ["sitzend",   "right:13%; bottom:58px; --rot:4deg"],
    ];
    const DEKO_PROJEKT = [
      [["sitzend",   "left:12%; bottom:50px; --rot:-3deg"], ["schlafend", "right:9%; bottom:18px"]],
      [["stehend",   "left:10%; bottom:44px; --rot:3deg"],  ["schlafend", "right:11%; bottom:22px"]],
      [["pfote",     "left:8%; bottom:48px; --rot:-4deg"],  ["sitzend",   "right:12%; bottom:30px; --rot:3deg"]],
    ];
    const OBEN_HUNDE = ["pfote", "sitzend", "stehend"];

    let dekoSchluessel = null;
    function dekoAufbauen() {
      const p = seite ? null : aktivesProjekt();
      const schluessel = p ? "p" + (p.id % 3) : "start";
      if (schluessel === dekoSchluessel) return;   // nur neu zeichnen, wenn die Seite wechselt
      dekoSchluessel = schluessel;

      const liste = p ? DEKO_PROJEKT[p.id % 3] : DEKO_START;
      dekoReihe.replaceChildren(
        ...liste.map(([name, stil]) => {
          const knopf = stickerKnopf(name, "st-" + name);
          knopf.style.cssText = stil;
          return knopf;
        })
      );
    }

    // ---------- Titel: Zitat ----------
    const ZITAT = "Wo man arbeitet, da ist Gewinn; wo man aber nur mit Worten umgeht, da ist Mangel.";
    document.getElementById("zitat").textContent = "„" + ZITAT + "“";

    // ---------- Konfetti ----------
    const canvas = document.getElementById("konfetti");
    const ctx = canvas.getContext("2d");
    const konfettiFarben = ["#A5BCD6", "#4D0E12", "#4A2E27", "#E3D37A", "#7E9CC4", "#8A3B3F"];
    let teilchen = [];
    let laeuft = false;

    function groesseAnpassen() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", groesseAnpassen);
    groesseAnpassen();

    function konfettiStarten() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      for (let i = 0; i < 120; i++) {
        teilchen.push({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * canvas.height * 0.3,
          breite: 6 + Math.random() * 6,
          hoehe: 10 + Math.random() * 8,
          farbe: konfettiFarben[Math.floor(Math.random() * konfettiFarben.length)],
          geschwindigkeit: 2 + Math.random() * 3,
          drift: (Math.random() - 0.5) * 2,
          winkel: Math.random() * Math.PI * 2,
          drehung: (Math.random() - 0.5) * 0.3,
        });
      }
      if (!laeuft) {
        laeuft = true;
        requestAnimationFrame(zeichnen);
      }
    }

    function zeichnen() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      teilchen.forEach((t) => {
        t.y += t.geschwindigkeit;
        t.x += t.drift;
        t.winkel += t.drehung;

        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.rotate(t.winkel);
        ctx.fillStyle = t.farbe;
        ctx.fillRect(-t.breite / 2, -t.hoehe / 2, t.breite, t.hoehe);
        ctx.restore();
      });

      teilchen = teilchen.filter((t) => t.y < canvas.height + 30);

      if (teilchen.length > 0) {
        requestAnimationFrame(zeichnen);
      } else {
        laeuft = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    laden();
    kalenderStart();   // zuerst die gemerkten Termine laden, dann anzeigen
    anzeigen();
    syncStarten();
  </script>
